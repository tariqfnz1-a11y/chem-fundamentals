<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧪 Chemistry Lab – Final</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <a href="#mainContent" class="skip-link">Skip to main content</a>

    <header class="header" role="banner" aria-label="Site header">
        <h1>🧪 Chemistry Lab <span>Final</span></h1>
        <div class="progress-area" role="status" aria-live="polite" aria-atomic="true">
            <span>Progress</span>
            <div class="progress-bar" aria-hidden="true">
                <div class="fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">0/12</span>
            <span class="badge"><span class="dot" aria-hidden="true"></span></span>
            <button id="helpBtn" aria-label="Start guided tour" style="background:#1e3a6b;border:none;color:#fff;padding:4px 14px;border-radius:30px;cursor:pointer;margin-left:8px;">❓ Help</button>
            <button id="exportBtn" aria-label="Export analytics data" style="background:#2d4a7a;border:none;color:#fff;padding:4px 14px;border-radius:30px;cursor:pointer;margin-left:8px;">📊 Export</button>
            <button id="resetProgressBtn" aria-label="Reset all progress" style="background:#5a1a2a;border:none;color:#fff;padding:4px 14px;border-radius:30px;cursor:pointer;margin-left:8px;">↺ Reset</button>
        </div>
    </header>

    <div class="app" role="application">
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Station navigation"></nav>
        <main class="main" id="mainContent" role="main"></main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
